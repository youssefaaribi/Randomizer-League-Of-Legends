<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Team Randomizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Beaufort+for+LOL:wght@700&family=Orbitron:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1428 0%, #091428 50%, #0a0a15 100%);
            font-family: 'Orbitron', sans-serif;
            color: #c8aa6e;
            overflow-x: hidden;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        h1 {
            text-align: center; font-size: 3rem; margin-bottom: 10px;
            background: linear-gradient(180deg, #f0e6d2 0%, #c8aa6e 50%, #7a5c29 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        .subtitle { text-align: center; color: #5b5a56; margin-bottom: 30px; font-size: 1rem; }

        .input-section {
            background: linear-gradient(180deg, #1e2328 0%, #111318 100%);
            border: 2px solid #785a28; border-radius: 10px; padding: 30px;
            margin-bottom: 30px; box-shadow: 0 0 20px rgba(120, 90, 40, 0.3);
        }
        .input-section h2 { color: #c8aa6e; margin-bottom: 20px; font-size: 1.3rem; }

        .players-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 20px; }
        .player-input { display: flex; flex-direction: column; gap: 5px; }
        .player-input label { color: #5b5a56; font-size: 0.8rem; }
        .player-input input {
            background: #0a0a15; border: 1px solid #463714; border-radius: 5px;
            padding: 12px; color: #f0e6d2; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; transition: all 0.3s;
        }
        .player-input input:focus { outline: none; border-color: #c8aa6e; box-shadow: 0 0 10px rgba(200, 170, 110, 0.3); }

        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        button {
            padding: 15px 40px; font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: bold;
            border: 2px solid #785a28; border-radius: 5px; cursor: pointer; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #startBtn { background: linear-gradient(180deg, #1e5128 0%, #0d2818 100%); color: #c8aa6e; }
        #startBtn:hover:not(:disabled) { background: linear-gradient(180deg, #2d7a3d 0%, #1e5128 100%); box-shadow: 0 0 20px rgba(45, 122, 61, 0.5); transform: scale(1.05); }
        #startBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #resetBtn { background: linear-gradient(180deg, #5c1a1a 0%, #2d0d0d 100%); color: #c8aa6e; }
        #resetBtn:hover { background: linear-gradient(180deg, #8b2828 0%, #5c1a1a 100%); box-shadow: 0 0 20px rgba(139, 40, 40, 0.5); transform: scale(1.05); }
        #musicBtn { background: linear-gradient(180deg, #1a3a5c 0%, #0d1d2d 100%); color: #c8aa6e; padding: 15px 25px; }
        #musicBtn:hover { background: linear-gradient(180deg, #28558b 0%, #1a3a5c 100%); box-shadow: 0 0 20px rgba(40, 85, 139, 0.5); }

        .teams-section { display: grid; grid-template-columns: 1fr auto 1fr; gap: 30px; align-items: start; }
        .team {
            background: linear-gradient(180deg, #1e2328 0%, #111318 100%);
            border: 2px solid #785a28; border-radius: 10px; padding: 25px; min-height: 400px;
        }
        .team-blue { border-color: #0088cc; box-shadow: 0 0 30px rgba(0, 136, 204, 0.2); }
        .team-red { border-color: #cc3300; box-shadow: 0 0 30px rgba(204, 51, 0, 0.2); }
        .team h2 { text-align: center; font-size: 1.8rem; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid; }
        .team-blue h2 { color: #0088cc; border-color: #0088cc; text-shadow: 0 0 20px rgba(0, 136, 204, 0.5); }
        .team-red h2 { color: #cc3300; border-color: #cc3300; text-shadow: 0 0 20px rgba(204, 51, 0, 0.5); }
        .team-slots { display: flex; flex-direction: column; gap: 15px; }

        .slot {
            background: #0a0a15; border: 1px solid #463714; border-radius: 8px;
            padding: 14px 20px; font-size: 1.2rem; color: #5b5a56; transition: all 0.3s;
            display: flex; align-items: center; gap: 15px;
        }
        .slot.filled { color: #f0e6d2; border-color: #c8aa6e; }
        .slot.selecting { animation: pulse 0.1s infinite; border-color: #ffcc00; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }

        .slot-role {
            min-width: 70px; padding: 5px 10px;
            background: linear-gradient(180deg, #785a28 0%, #463714 100%); border-radius: 4px;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; color: #f0e6d2;
        }
        .slot-role img { width: 22px; height: 22px; flex-shrink: 0; filter: brightness(1.3); }
        .slot-name { flex: 1; }

        @keyframes pulse { 0%, 100% { background: #0a0a15; } 50% { background: #1a1a25; } }

        .vs-section { display: flex; align-items: center; justify-content: center; }
        .vs {
            font-size: 4rem; font-weight: 900;
            background: linear-gradient(180deg, #f0e6d2 0%, #c8aa6e 50%, #7a5c29 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .randomizer-display {
            text-align: center; margin-bottom: 30px; min-height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .current-pick { font-size: 2.5rem; color: #ffcc00; text-shadow: 0 0 20px rgba(255, 204, 0, 0.5); animation: glow 0.5s infinite alternate; }
        .pick-label { color: #5b5a56; font-size: 1rem; margin-bottom: 10px; }
        @keyframes glow { from { text-shadow: 0 0 20px rgba(255, 204, 0, 0.5); } to { text-shadow: 0 0 40px rgba(255, 204, 0, 0.8); } }

        .remaining-pool {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px;
            padding: 20px; background: rgba(10, 10, 21, 0.5); border-radius: 10px; min-height: 60px;
        }
        .pool-player { background: linear-gradient(180deg, #1e2328 0%, #111318 100%); border: 1px solid #463714; padding: 8px 15px; border-radius: 5px; color: #c8aa6e; font-size: 0.9rem; transition: all 0.3s; }
        .pool-player.highlight { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255, 204, 0, 0.5); transform: scale(1.1); color: #ffcc00; }
        .pool-player.selected { opacity: 0.3; text-decoration: line-through; }

        .volume-control { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 15px; }
        .volume-control label { color: #5b5a56; font-size: 0.8rem; }
        .volume-control input[type="range"] { width: 100px; accent-color: #c8aa6e; }

        #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

        /* ── Minimap Section ── */
        .minimap-section {
            margin-top: 40px; display: none; flex-direction: column; align-items: center;
            animation: fadeInMap 0.8s ease-out;
        }
        .minimap-section.visible { display: flex; }
        .minimap-section h2 { color: #c8aa6e; font-size: 1.5rem; margin-bottom: 20px; text-align: center; letter-spacing: 2px; }

        .minimap-wrapper {
            position: relative; width: 600px; height: 600px;
            border: 3px solid #785a28; border-radius: 8px; overflow: hidden;
            box-shadow: 0 0 40px rgba(120, 90, 40, 0.4), inset 0 0 30px rgba(0, 0, 0, 0.5);
            background: #0a1428;
        }

        .minimap-bg {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        .map-tokens-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        .map-token {
            position: absolute; display: flex; flex-direction: column; align-items: center;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto; cursor: default;
        }
        .map-token.visible { transform: translate(-50%, -50%) scale(1); }

        .token-circle {
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        .token-circle.blue { background: radial-gradient(circle, #1a5a9a, #0a2a5a); border: 2.5px solid #44aaee; }
        .token-circle.red { background: radial-gradient(circle, #9a3a1a, #5a1a0a); border: 2.5px solid #ee6644; }

        .token-circle img { width: 22px; height: 22px; filter: brightness(1.5); }

        .token-circle::after {
            content: ''; position: absolute; inset: -6px; border-radius: 50%;
            border: 2px solid; opacity: 0.3; animation: tokenRing 2s ease-in-out infinite;
        }
        .token-circle.blue::after { border-color: #44aaee; }
        .token-circle.red::after { border-color: #ee6644; }

        @keyframes tokenRing {
            0%, 100% { opacity: 0.1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.15); }
        }

        .token-name {
            margin-top: 4px; font-size: 9px; font-weight: bold; letter-spacing: 0.5px;
            padding: 2px 6px; border-radius: 3px; white-space: nowrap;
            text-shadow: 0 0 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.8);
            font-family: 'Orbitron', sans-serif;
        }
        .token-name.blue { color: #66ccff; }
        .token-name.red { color: #ff8866; }

        .token-role {
            position: absolute; top: -14px; font-size: 7px; font-weight: bold;
            letter-spacing: 1px; font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 4px rgba(0,0,0,1), 0 0 8px rgba(0,0,0,0.8);
        }
        .token-role.blue { color: #88bbdd; }
        .token-role.red { color: #dd8877; }

        @keyframes fadeInMap {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1200px) {
            .players-grid { grid-template-columns: repeat(2, 1fr); }
            .teams-section { grid-template-columns: 1fr; }
            .vs-section { order: -1; }
            .vs { font-size: 2rem; }
            .minimap-wrapper { width: 95vw; height: 95vw; max-width: 600px; max-height: 600px; }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>

    <div class="container">
        <h1>⚔️ LOL TEAM RANDOMIZER ⚔️</h1>
        <p class="subtitle">Créez vos équipes 5v5 avec style</p>

        <div class="input-section">
            <h2>👥 Entrez les 10 joueurs</h2>
            <div class="players-grid">
                <div class="player-input"><label>Joueur 1</label><input type="text" id="player1" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 2</label><input type="text" id="player2" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 3</label><input type="text" id="player3" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 4</label><input type="text" id="player4" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 5</label><input type="text" id="player5" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 6</label><input type="text" id="player6" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 7</label><input type="text" id="player7" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 8</label><input type="text" id="player8" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 9</label><input type="text" id="player9" placeholder="Nom..."></div>
                <div class="player-input"><label>Joueur 10</label><input type="text" id="player10" placeholder="Nom..."></div>
            </div>

            <div class="controls">
                <button id="musicBtn">🔊 GEAR 5 MUSIC</button>
                <button id="startBtn">🎲 LANCER LE TIRAGE</button>
                <button id="resetBtn">🔄 Reset</button>
            </div>

            <div class="volume-control">
                <label>Volume:</label>
                <input type="range" id="volume" min="0" max="100" value="50">
            </div>

            <audio id="bgMusic" loop>
                <source src="One Piece  Drums of Liberation x Overtaken (GEAR 5) [EPIC COVER].mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="randomizer-display">
            <div class="pick-label" id="pickLabel">Prêt pour le tirage...</div>
            <div class="current-pick" id="currentPick"></div>
            <div class="remaining-pool" id="remainingPool"></div>
        </div>

        <div class="teams-section">
            <div class="team team-blue">
                <h2>🔵 TEAM BLUE</h2>
                <div class="team-slots" id="blueTeam"></div>
            </div>
            <div class="vs-section"><div class="vs">VS</div></div>
            <div class="team team-red">
                <h2>🔴 TEAM RED</h2>
                <div class="team-slots" id="redTeam"></div>
            </div>
        </div>

        <!-- Minimap -->
        <div class="minimap-section" id="minimapSection">
            <h2>🗺️ SUMMONER'S RIFT</h2>
            <div class="minimap-wrapper">
                <img class="minimap-bg" id="minimapImg"
                     src="https://static.wikia.nocookie.net/leagueoflegends/images/0/04/Summoner%27s_Rift_Minimap.png/revision/latest?cb=20200102040224"
                     alt="Summoner's Rift Minimap"
                     crossorigin="anonymous"
                >
                <div class="map-tokens-overlay" id="mapTokensOverlay"></div>
            </div>
        </div>
    </div>

    <script>
        // ── Official LoL Position Icons from CommunityDragon ──
        const cdnBase = 'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-clash/global/default/assets/images/position-selector/positions/';
        const roleIconUrls = {
            TOP:  cdnBase + 'icon-position-top.png',
            JGL:  cdnBase + 'icon-position-jungle.png',
            MID:  cdnBase + 'icon-position-middle.png',
            ADC:  cdnBase + 'icon-position-bottom.png',
            SUP:  cdnBase + 'icon-position-utility.png'
        };

        const roles = ['TOP', 'JGL', 'MID', 'ADC', 'SUP'];

        // ── Map positions (% from top-left) - calibrated to the actual LoL minimap ──
        // Blue side: bottom-left, Red side: top-right
        const mapPositions = {
            blue: {
                TOP: { x: 12, y: 35 },   // Top lane, blue side (left wall going up)
                JGL: { x: 28, y: 58 },   // Blue jungle
                MID: { x: 38, y: 68 },   // Mid lane, blue side
                ADC: { x: 55, y: 90 },   // Bot lane, blue side
                SUP: { x: 45, y: 88 }    // Support near ADC
            },
            red: {
                TOP: { x: 45, y: 12 },   // Top lane, red side
                JGL: { x: 72, y: 42 },   // Red jungle
                MID: { x: 62, y: 32 },   // Mid lane, red side
                ADC: { x: 88, y: 55 },   // Bot lane, red side (right wall going down)
                SUP: { x: 88, y: 45 }    // Support near ADC
            }
        };

        // ── Generate team slot HTML ──
        function generateSlots() {
            ['blueTeam', 'redTeam'].forEach(teamId => {
                const prefix = teamId === 'blueTeam' ? 'blue' : 'red';
                const container = document.getElementById(teamId);
                container.innerHTML = '';
                roles.forEach((role, i) => {
                    const div = document.createElement('div');
                    div.className = 'slot';
                    div.id = `${prefix}${i + 1}`;
                    div.innerHTML = `<span class="slot-role"><img src="${roleIconUrls[role]}" alt="${role}"> ${role}</span><span class="slot-name">En attente...</span>`;
                    container.appendChild(div);
                });
            });
        }
        generateSlots();

        // ── Minimap Token Rendering ──
        function renderMinimapTokens(blueAssignment, redAssignment) {
            const overlay = document.getElementById('mapTokensOverlay');
            overlay.innerHTML = '';

            const allTokens = [];
            roles.forEach((role, i) => {
                allTokens.push({ name: blueAssignment[i], role, team: 'blue' });
                allTokens.push({ name: redAssignment[i], role, team: 'red' });
            });

            allTokens.forEach((token, idx) => {
                const pos = mapPositions[token.team][token.role];
                const el = document.createElement('div');
                el.className = 'map-token';
                el.style.left = pos.x + '%';
                el.style.top = pos.y + '%';

                const displayName = token.name.length > 8 ? token.name.substring(0, 7) + '…' : token.name;

                el.innerHTML = `
                    <div class="token-role ${token.team}">${token.role}</div>
                    <div class="token-circle ${token.team}">
                        <img src="${roleIconUrls[token.role]}" alt="${token.role}">
                    </div>
                    <div class="token-name ${token.team}">${displayName}</div>
                `;

                overlay.appendChild(el);

                // Stagger animation
                setTimeout(() => el.classList.add('visible'), 100 + idx * 150);
            });

            document.getElementById('minimapSection').classList.add('visible');
        }

        // ── Confetti System ──
        const confettiCanvas = document.getElementById('confettiCanvas');
        const ctx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimId = null;

        function resizeCanvas() { confettiCanvas.width = window.innerWidth; confettiCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const confettiColors = ['#c8aa6e','#f0e6d2','#0088cc','#cc3300','#ffcc00','#38ef7d','#ff6b6b','#a855f7','#3b82f6','#ef4444','#22d3ee','#f97316'];

        function spawnBurst(count, startY, spreadX, spreadVy) {
            for (let i = 0; i < count; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width, y: startY + (Math.random() - 0.5) * 100,
                    w: Math.random() * 10 + 5, h: Math.random() * 6 + 3,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    vx: (Math.random() - 0.5) * spreadX, vy: Math.random() * spreadVy + 1.5,
                    rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 10, opacity: 1
                });
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let alive = false;
            confettiParticles.forEach(p => {
                if (p.opacity <= 0) return; alive = true;
                p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.rotSpeed;
                if (p.y > confettiCanvas.height * 0.75) p.opacity -= 0.015;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.rot * Math.PI) / 180);
                ctx.globalAlpha = Math.max(0, p.opacity); ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
            });
            if (alive) confettiAnimId = requestAnimationFrame(animateConfetti);
            else { ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); confettiAnimId = null; }
        }

        function launchConfetti() {
            if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
            confettiParticles = [];
            spawnBurst(200, -100, 4, 3); animateConfetti();
            setTimeout(() => spawnBurst(120, -50, 6, 2), 500);
            setTimeout(() => spawnBurst(80, -30, 5, 2.5), 1000);
        }

        // ── Audio ──
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;
        document.getElementById('volume').addEventListener('input', (e) => { bgMusic.volume = e.target.value / 100; });
        bgMusic.volume = 0.5;

        function toggleMusic() {
            if (isPlaying) { bgMusic.pause(); isPlaying = false; document.getElementById('musicBtn').textContent = '🔊 GEAR 5 MUSIC'; }
            else { bgMusic.play(); isPlaying = true; document.getElementById('musicBtn').textContent = '🔇 Stop'; }
        }
        document.getElementById('musicBtn').addEventListener('click', toggleMusic);

        // ── Randomizer Logic ──
        let players = [];
        let remainingPlayers = [];
        let blueTeam = [];
        let redTeam = [];
        let isRandomizing = false;
        let previousAssignments = {};

        function generateValidAssignment(playerList) {
            const maxAttempts = 200;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const shuffled = shuffle([...playerList]);
                const blue = shuffled.slice(0, 5), red = shuffled.slice(5, 10);
                let valid = true;
                for (let i = 0; i < 5; i++) {
                    if (previousAssignments[blue[i]] === roles[i] || previousAssignments[red[i]] === roles[i]) { valid = false; break; }
                }
                if (valid) return { blue, red };
            }
            const shuffled = shuffle([...playerList]);
            return { blue: shuffled.slice(0, 5), red: shuffled.slice(5, 10) };
        }

        function getPlayers() {
            const p = [];
            for (let i = 1; i <= 10; i++) { const n = document.getElementById(`player${i}`).value.trim(); if (n) p.push(n); }
            return p;
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
            return arr;
        }

        function updateRemainingPool() {
            const pool = document.getElementById('remainingPool'); pool.innerHTML = '';
            players.forEach(player => {
                const div = document.createElement('div');
                div.className = 'pool-player'; div.textContent = player;
                div.id = `pool-${player.replace(/\s/g, '-')}`;
                if (!remainingPlayers.includes(player)) div.classList.add('selected');
                pool.appendChild(div);
            });
        }

        function highlightPlayer(name) {
            document.querySelectorAll('.pool-player').forEach(el => el.classList.remove('highlight'));
            const el = document.getElementById(`pool-${name.replace(/\s/g, '-')}`);
            if (el) el.classList.add('highlight');
        }

        async function randomizePick(slotId, team, predeterminedPlayer) {
            return new Promise(resolve => {
                const slot = document.getElementById(slotId);
                const nameSpan = slot.querySelector('.slot-name');
                slot.classList.add('selecting');
                let iterations = 0, maxIterations = 20 + Math.floor(Math.random() * 10), speed = 50;
                function animate() {
                    if (iterations >= maxIterations) {
                        remainingPlayers.splice(remainingPlayers.indexOf(predeterminedPlayer), 1);
                        team.push(predeterminedPlayer);
                        nameSpan.textContent = predeterminedPlayer;
                        slot.classList.remove('selecting'); slot.classList.add('filled');
                        highlightPlayer(predeterminedPlayer);
                        document.getElementById('currentPick').textContent = predeterminedPlayer;
                        updateRemainingPool();
                        setTimeout(resolve, 500); return;
                    }
                    const rp = remainingPlayers[Math.floor(Math.random() * remainingPlayers.length)];
                    nameSpan.textContent = rp; highlightPlayer(rp);
                    document.getElementById('currentPick').textContent = rp;
                    iterations++; speed += 10; setTimeout(animate, speed);
                }
                animate();
            });
        }

        async function startRandomizer() {
            if (isRandomizing) return;
            players = getPlayers();
            if (players.length !== 10) { alert('Vous devez entrer exactement 10 joueurs !'); return; }

            isRandomizing = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('minimapSection').classList.remove('visible');

            const assignment = generateValidAssignment(players);
            remainingPlayers = shuffle([...assignment.blue, ...assignment.red]);
            blueTeam = []; redTeam = [];

            for (let i = 1; i <= 5; i++) {
                ['blue','red'].forEach(side => {
                    const s = document.getElementById(`${side}${i}`);
                    s.classList.remove('filled', 'selecting');
                    s.querySelector('.slot-name').textContent = 'En attente...';
                });
            }

            updateRemainingPool();
            if (!isPlaying) toggleMusic();

            const pickOrder = [
                { slot: 'blue1', team: blueTeam, label: '🔵 BLUE - TOP', player: assignment.blue[0] },
                { slot: 'red1', team: redTeam, label: '🔴 RED - TOP', player: assignment.red[0] },
                { slot: 'blue2', team: blueTeam, label: '🔵 BLUE - JGL', player: assignment.blue[1] },
                { slot: 'red2', team: redTeam, label: '🔴 RED - JGL', player: assignment.red[1] },
                { slot: 'blue3', team: blueTeam, label: '🔵 BLUE - MID', player: assignment.blue[2] },
                { slot: 'red3', team: redTeam, label: '🔴 RED - MID', player: assignment.red[2] },
                { slot: 'blue4', team: blueTeam, label: '🔵 BLUE - ADC', player: assignment.blue[3] },
                { slot: 'red4', team: redTeam, label: '🔴 RED - ADC', player: assignment.red[3] },
                { slot: 'blue5', team: blueTeam, label: '🔵 BLUE - SUP', player: assignment.blue[4] },
                { slot: 'red5', team: redTeam, label: '🔴 RED - SUP', player: assignment.red[4] },
            ];

            for (const pick of pickOrder) {
                document.getElementById('pickLabel').textContent = pick.label;
                await randomizePick(pick.slot, pick.team, pick.player);
                await new Promise(r => setTimeout(r, 800));
            }

            previousAssignments = {};
            for (let i = 0; i < 5; i++) {
                previousAssignments[assignment.blue[i]] = roles[i];
                previousAssignments[assignment.red[i]] = roles[i];
            }

            document.getElementById('pickLabel').textContent = '✅ ÉQUIPES COMPLÈTES !';
            document.getElementById('currentPick').textContent = 'GLHF ! 🎮';

            launchConfetti();

            setTimeout(() => {
                renderMinimapTokens(assignment.blue, assignment.red);
                document.getElementById('minimapSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 600);

            isRandomizing = false;
            document.getElementById('startBtn').disabled = false;
        }

        function reset() {
            if (isPlaying) toggleMusic();
            if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height); }

            isRandomizing = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('minimapSection').classList.remove('visible');
            document.getElementById('mapTokensOverlay').innerHTML = '';

            for (let i = 1; i <= 10; i++) document.getElementById(`player${i}`).value = '';
            for (let i = 1; i <= 5; i++) {
                ['blue','red'].forEach(side => {
                    const s = document.getElementById(`${side}${i}`);
                    s.classList.remove('filled', 'selecting');
                    s.querySelector('.slot-name').textContent = 'En attente...';
                });
            }

            document.getElementById('remainingPool').innerHTML = '';
            document.getElementById('pickLabel').textContent = 'Prêt pour le tirage...';
            document.getElementById('currentPick').textContent = '';

            players = []; remainingPlayers = []; blueTeam = []; redTeam = [];
            previousAssignments = {};
        }

        document.getElementById('startBtn').addEventListener('click', startRandomizer);
        document.getElementById('resetBtn').addEventListener('click', reset);

        const exampleNames = ['Faker', 'Caps', 'Rekkles', 'Perkz', 'Jankos', 'Canyon', 'Chovy', 'Gumayusi', 'Zeus', 'Keria'];
        document.querySelectorAll('.player-input input').forEach((input, index) => {
            input.addEventListener('dblclick', () => { if (!input.value) input.value = exampleNames[index]; });
        });
    </script>
</body>
</html>
